<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Script output window: the launcher's tile turned into a dark terminal
       with the launcher's teal as its title bar and prompt. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="8" x2="0" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34404d"/>
      <stop offset="1" stop-color="#1b222b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="8" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2cc9b4"/>
      <stop offset="1" stop-color="#14a594"/>
    </linearGradient>
    <clipPath id="face">
      <rect x="8" y="8" width="112" height="108" rx="26"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#10151b"/>
  <rect x="8" y="8" width="112" height="108" rx="26" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="28" fill="url(#bar)" clip-path="url(#face)"/>
  <g fill="#0a5e57" opacity="0.55">
    <circle cx="30" cy="22" r="4.5"/>
    <circle cx="44" cy="22" r="4.5"/>
    <circle cx="58" cy="22" r="4.5"/>
  </g>
  <g fill="#5d6b7a">
    <rect x="26" y="50" width="56" height="7" rx="3.5"/>
    <rect x="26" y="64" width="38" height="7" rx="3.5"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <path d="M28 82l12 10-12 10" stroke="#3fe0c8"/>
    <path d="M50 102h22" stroke="#ffffff"/>
  </g>
</svg>
